<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Panel — KSGP GAMES</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app" style="max-width:640px;margin:0 auto;padding:16px;">
    <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h1 style="font-size:1.3rem;"><span class="token">KSGP</span> GAMES</h1>
      <a href="/" class="btn small">← Games</a>
      <a href="/explorer.html" class="btn small">Ledger</a>
    </header>
    <div class="card">
      <h2>Token wallet</h2>
      <p style="font-size:1.6rem;font-weight:700;color:#00e676;">
        <span id="u-ksgp">0</span> <span class="token">ksgp</span>
      </p>
      <p>Stage: <strong id="u-level">1</strong> · Games played: <strong id="u-games">0</strong></p>
      <p id="u-name" style="opacity:0.8;"></p>
    </div>
    <div class="card" style="margin-top:14px;">
      <h2>Activity report</h2>
      <p style="opacity:0.75;font-size:0.85rem;">Your token changes (stages, jackpot, login…)</p>
      <div id="u-history" style="max-height:420px;overflow:auto;font-size:0.82rem;"></div>
    </div>
  </div>
  <footer class="site-footer"><span>All rights reserved by KSGP token</span></footer>
  <script>
    async function load() {
      const me = await fetch('/api/me', { credentials: 'include' }).then(r => r.json());
      if (!me.authenticated) { location.href = '/'; return; }
      document.getElementById('u-ksgp').textContent = Number(me.user.ksgp).toLocaleString();
      document.getElementById('u-level').textContent = me.user.currentLevel;
      document.getElementById('u-games').textContent = me.user.gamesPlayed;
      document.getElementById('u-name').textContent = me.user.name + ' · ' + me.user.email;
      const h = await fetch('/api/me/history', { credentials: 'include' }).then(r => r.json());
      const box = document.getElementById('u-history');
      if (!h.history || !h.history.length) {
        box.innerHTML = '<p style="opacity:0.6;">No activity yet.</p>';
        return;
      }
      box.innerHTML = h.history.map(row => {
        const amt = Number(row.amount) || 0;
        const sign = amt > 0 ? '+' : '';
        const col = amt > 0 ? '#69f0ae' : (amt < 0 ? '#ff8a80' : '#aaa');
        const t = new Date(row.created_at).toLocaleString();
        return `<div style="border-bottom:1px solid rgba(255,255,255,0.08);padding:8px 0;">
          <div><strong>${row.action}</strong> · <span style="color:${col}">${sign}${amt.toLocaleString()} ksgp</span>
          · bal ${row.balance_after != null ? Number(row.balance_after).toLocaleString() : '—'}</div>
          <div style="opacity:0.55;font-size:0.75rem;">${t}</div>
        </div>`;
      }).join('');
    }
    load();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blockchain Explorer — KSGP GAMES</title>
  <link rel="stylesheet" href="/style.css?v=5" />
  <style>
    body { background: #0b1220; color: #e8eef7; }
    .ex-wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .ex-header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .ex-header h1 { font-size:1.25rem; margin:0; }
    .ex-grid { display:grid; grid-template-columns: 280px 1fr; gap:14px; }
    @media (max-width:800px){ .ex-grid { grid-template-columns: 1fr; } }
    .ex-panel {
      background: #121a2b;
      border: 1px solid #243049;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .ex-panel h2 {
      margin: 0 0 12px;
      font-size: 0.95rem;
      color: #2ee6c5;
      letter-spacing: 0.5px;
    }
    .stat-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .stat {
      background: #0d1524;
      border: 1px solid #243049;
      border-radius: 12px;
      padding: 10px 14px;
      min-width: 120px;
    }
    .stat .k { font-size:0.72rem; opacity:0.65; }
    .stat .v { font-size:1.15rem; font-weight:700; color:#ffd54f; }
    .block-item {
      background: #0d1524;
      border: 1px solid #2a3a55;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .block-item:hover, .block-item.active { border-color: #2ee6c5; }
    .block-item .bn { color:#ffd54f; font-weight:700; }
    .block-item .hh { font-size:0.7rem; opacity:0.55; word-break:break-all; margin-top:4px; font-family: ui-monospace, monospace; }
    table.ex-table { width:100%; border-collapse:collapse; font-size:0.8rem; }
    table.ex-table th { text-align:left; opacity:0.6; font-weight:600; padding:8px 6px; border-bottom:1px solid #243049; }
    table.ex-table td { padding:9px 6px; border-bottom:1px solid #1a2438; vertical-align:middle; }
    table.ex-table tr { cursor:pointer; }
    table.ex-table tr:hover { background: rgba(46,230,197,0.06); }
    .badge {
      display:inline-block; padding:3px 8px; border-radius:6px;
      font-size:0.7rem; font-weight:700; letter-spacing:0.3px;
      background:#1e293b; color:#e2e8f0;
    }
    .badge.login { background:#1e3a5f; color:#93c5fd; }
    .badge.level_complete { background:#14532d; color:#86efac; }
    .badge.jackpot_win { background:#365314; color:#bef264; }
    .badge.jackpot_lose { background:#4c0519; color:#fda4af; }
    .badge.save_game { background:#312e81; color:#c7d2fe; }
    .hash { font-family: ui-monospace, monospace; font-size:0.72rem; color:#2ee6c5; }
    .amt-pos { color:#69f0ae; font-weight:600; }
    .amt-neg { color:#ff8a80; font-weight:600; }
    .detail-view { display:none; }
    .detail-view.show { display:block; }
    .list-view.hide { display:none; }
    .kv { display:grid; grid-template-columns: 160px 1fr; gap:8px 12px; font-size:0.88rem; }
    .kv .lab { opacity:0.6; }
    .kv .val { word-break:break-all; font-family: ui-monospace, monospace; font-size:0.8rem; }
    .detail-box {
      background:#0d1524; border:1px solid #243049; border-radius:12px;
      padding:12px; margin-top:12px; white-space:pre-wrap; font-family:ui-monospace,monospace; font-size:0.78rem;
    }
    .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .filters select, .filters input {
      background:#0d1524; border:1px solid #243049; color:#fff;
      border-radius:8px; padding:7px 10px; font-size:0.85rem;
    }
    .note { font-size:0.78rem; opacity:0.65; margin-top:10px; }
  </style>
</head>
<body>
  <div class="ex-wrap">
    <div class="ex-header">
      <h1>🛡️ KSGP GAMES · Blockchain Ledger</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="btn small" href="/">← Games</a>
        <a class="btn small" href="/user.html">My Panel</a>
        <button class="btn small" id="btn-refresh">Refresh</button>
      </div>
    </div>

    <div class="stat-row" id="stats"></div>

    <div class="list-view" id="list-view">
      <div class="ex-grid">
        <div class="ex-panel">
          <h2>📦 SEALED BLOCKS</h2>
          <div id="blocks"></div>
        </div>
        <div class="ex-panel">
          <h2>⚡ LIVE TRANSACTIONS</h2>
          <div class="filters">
            <select id="filter-action">
              <option value="">All operations</option>
              <option value="login">LOGIN</option>
              <option value="level_complete">LEVEL COMPLETE</option>
              <option value="jackpot_win">JACKPOT WIN</option>
              <option value="jackpot_lose">JACKPOT LOSE</option>
              <option value="save_game">SAVE GAME</option>
            </select>
            <input id="filter-email" placeholder="Filter email" />
            <button class="btn small" id="btn-apply">Apply</button>
          </div>
          <div style="overflow:auto;">
            <table class="ex-table">
              <thead>
                <tr>
                  <th>Operation</th>
                  <th>User</th>
                  <th>Amount</th>
                  <th>Tx Hash</th>
                  <th>Time</th>
                </tr>
              </thead>
              <tbody id="tx-body"></tbody>
            </table>
          </div>
          <p class="note">Click any row for full details · Records linked by SHA-256 chain hash</p>
        </div>
      </div>
    </div>

    <div class="detail-view" id="detail-view">
      <div class="ex-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <h2 style="margin:0;">📄 Transaction Details</h2>
          <div>
            <button class="btn small" id="btn-prev">← Prev</button>
            <button class="btn small" id="btn-back-list">Back to list</button>
            <button class="btn small" id="btn-next">Next →</button>
          </div>
        </div>
        <div id="detail-body" style="margin-top:16px;"></div>
      </div>
    </div>
  </div>

  <footer class="site-footer"><span>All rights reserved by KSGP token</span></footer>

  <script>
    let currentPrev = null, currentNext = null;

    function shortHash(h) {
      if (!h) return '—';
      return h.slice(0, 10) + '…' + h.slice(-6);
    }
    function badge(action) {
      return `<span class="badge ${action}">${(action || '').toUpperCase()}</span>`;
    }
    function amtHtml(n) {
      const v = Number(n) || 0;
      if (v > 0) return `<span class="amt-pos">+${v.toLocaleString()}</span>`;
      if (v < 0) return `<span class="amt-neg">${v.toLocaleString()}</span>`;
      return `<span style="opacity:0.5">0</span>`;
    }
    function timeStr(t) {
      if (!t) return '—';
      return new Date(t).toLocaleString();
    }
    function explain(tx) {
      const d = tx.detail || {};
      switch (tx.action) {
        case 'login':
          return `User signed in with Google` + (d.name ? ` as “${d.name}”` : '');
        case 'level_complete':
          return `Completed stage ${d.level ?? '?'} and earned ${(d.earned ?? tx.amount) || 0} ksgp` + (d.game ? ` (${d.game})` : '');
        case 'jackpot_win':
          return `Jackpot WIN · bet ${d.bet} · reels [${(d.reels||[]).join(', ')}] · won ${d.win} (×${d.mult})`;
        case 'jackpot_lose':
          return `Jackpot lose · bet ${d.bet} · reels [${(d.reels||[]).join(', ')}]`;
        case 'save_game':
          return `Saved game progress · type ${d.gameType || '?'} · stage ${d.level ?? '?'} · score ${d.score ?? 0}`;
        default:
          return JSON.stringify(d);
      }
    }

    async function loadSummary() {
      const s = await fetch('/api/explorer/summary').then(r => r.json());
      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="k">Total transactions</div><div class="v">${s.totalTransactions||0}</div></div>
        <div class="stat"><div class="k">Sealed blocks</div><div class="v">${s.totalBlocks||0}</div></div>
        <div class="stat"><div class="k">Last action</div><div class="v" style="font-size:0.95rem">${s.lastTx ? s.lastTx.action : '—'}</div></div>
      `;
    }

    async function loadBlocks() {
      const data = await fetch('/api/explorer/blocks').then(r => r.json());
      const box = document.getElementById('blocks');
      if (!data.blocks || !data.blocks.length) {
        box.innerHTML = '<p style="opacity:0.5">No blocks yet — play to create chain entries.</p>';
        return;
      }
      box.innerHTML = data.blocks.map(b => `
        <div class="block-item" data-block="${b.number}">
          <div class="bn">Block #${b.number}</div>
          <div style="font-size:0.78rem;opacity:0.75">${b.txCount} txs · ${timeStr(b.lastAt)}</div>
          <div class="hh">${b.headHash || ''}</div>
        </div>
      `).join('');
      box.querySelectorAll('.block-item').forEach(el => {
        el.onclick = () => openBlock(el.dataset.block);
      });
    }

    async function loadTxs() {
      const action = document.getElementById('filter-action').value;
      const email = document.getElementById('filter-email').value.trim();
      let url = '/api/explorer/transactions?limit=50';
      if (action) url += '&action=' + encodeURIComponent(action);
      if (email) url += '&email=' + encodeURIComponent(email);
      const data = await fetch(url).then(r => r.json());
      const tb = document.getElementById('tx-body');
      if (!data.transactions || !data.transactions.length) {
        tb.innerHTML = '<tr><td colspan="5" style="opacity:0.5">No transactions</td></tr>';
        return;
      }
      tb.innerHTML = data.transactions.map(tx => `
        <tr data-id="${tx.id}">
          <td>${badge(tx.action)}</td>
          <td>${tx.email || '—'}</td>
          <td>${amtHtml(tx.amount)}</td>
          <td class="hash" title="${tx.txHash||''}">${shortHash(tx.txHash)}</td>
          <td>${timeStr(tx.createdAt)}</td>
        </tr>
      `).join('');
      tb.querySelectorAll('tr[data-id]').forEach(tr => {
        tr.onclick = () => openTx(tr.dataset.id);
      });
    }

    async function openTx(id) {
      const data = await fetch('/api/explorer/tx/' + id).then(r => r.json());
      if (data.error) { alert(data.error); return; }
      const tx = data.transaction;
      currentPrev = data.prevId;
      currentNext = data.nextId;
      document.getElementById('list-view').classList.add('hide');
      document.getElementById('detail-view').classList.add('show');
      document.getElementById('detail-body').innerHTML = `
        <div class="kv">
          <div class="lab">Transaction ID</div><div class="val">#${tx.id}</div>
          <div class="lab">TX Hash (SHA-256)</div><div class="val" style="color:#2ee6c5">${tx.txHash || '—'}</div>
          <div class="lab">Previous Hash</div><div class="val">${tx.prevHash || '—'}</div>
          <div class="lab">Block</div><div class="val">#${tx.blockNumber ?? '—'}</div>
          <div class="lab">Operation</div><div class="val">${badge(tx.action)}</div>
          <div class="lab">User email</div><div class="val">${tx.email || '—'}</div>
          <div class="lab">User ID</div><div class="val">${tx.userId || '—'}</div>
          <div class="lab">Amount (ksgp)</div><div class="val">${amtHtml(tx.amount)}</div>
          <div class="lab">Balance after</div><div class="val">${tx.balanceAfter != null ? Number(tx.balanceAfter).toLocaleString() : '—'}</div>
          <div class="lab">Timestamp</div><div class="val">${timeStr(tx.createdAt)}</div>
          <div class="lab">What happened</div><div class="val" style="font-family:inherit;font-size:0.9rem">${explain(tx)}</div>
        </div>
        <div class="detail-box">${JSON.stringify(tx.detail || {}, null, 2)}</div>
        <p class="note">${data.note || ''}</p>
        <p class="note">Shareable link: <a href="/explorer.html?tx=${tx.id}" style="color:#2ee6c5">/explorer.html?tx=${tx.id}</a></p>
      `;
      history.replaceState(null, '', '/explorer.html?tx=' + tx.id);
    }

    async function openBlock(num) {
      const data = await fetch('/api/explorer/block/' + num).then(r => r.json());
      document.getElementById('filter-action').value = '';
      document.getElementById('filter-email').value = '';
      const tb = document.getElementById('tx-body');
      tb.innerHTML = (data.transactions || []).map(tx => `
        <tr data-id="${tx.id}">
          <td>${badge(tx.action)}</td>
          <td>${tx.email || '—'}</td>
          <td>${amtHtml(tx.amount)}</td>
          <td class="hash">${shortHash(tx.txHash)}</td>
          <td>${timeStr(tx.createdAt)}</td>
        </tr>
      `).join('') || '<tr><td colspan="5">Empty block</td></tr>';
      tb.querySelectorAll('tr[data-id]').forEach(tr => {
        tr.onclick = () => openTx(tr.dataset.id);
      });
      document.querySelectorAll('.block-item').forEach(el => {
        el.classList.toggle('active', el.dataset.block === String(num));
      });
    }

    function showList() {
      document.getElementById('list-view').classList.remove('hide');
      document.getElementById('detail-view').classList.remove('show');
      history.replaceState(null, '', '/explorer.html');
    }

    document.getElementById('btn-back-list').onclick = showList;
    document.getElementById('btn-prev').onclick = () => { if (currentPrev) openTx(currentPrev); };
    document.getElementById('btn-next').onclick = () => { if (currentNext) openTx(currentNext); };
    document.getElementById('btn-refresh').onclick = () => { loadSummary(); loadBlocks(); loadTxs(); };
    document.getElementById('btn-apply').onclick = loadTxs;

    (async function init() {
      await loadSummary();
      await loadBlocks();
      await loadTxs();
      const params = new URLSearchParams(location.search);
      if (params.get('tx')) openTx(params.get('tx'));
      if (params.get('block')) openBlock(params.get('block'));
    })();
  </script>
</body>
</html>

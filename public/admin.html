<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — KSGP GAMES</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app" style="max-width:960px;margin:0 auto;padding:16px;">
    <header style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <h1 style="font-size:1.3rem;">Admin · <span class="token">KSGP</span> GAMES</h1>
      <div>
        <a href="/" class="btn small">Games</a>
        <a href="/explorer.html" class="btn small">Public Ledger</a>
        <a href="/auth/logout" class="btn small logout">Logout</a>
      </div>
    </header>
    <p id="admin-status" style="color:#ff8a80;"></p>
    <div id="admin-content" class="hidden">
      <div class="card" style="margin-top:12px;">
        <h2>Summary</h2>
        <div id="summary" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;"></div>
      </div>
      <div class="card" style="margin-top:14px;">
        <h2>Users</h2>
        <div style="overflow:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:0.8rem;" id="users-table">
            <thead><tr style="text-align:left;border-bottom:1px solid #444;">
              <th>Name</th><th>Email</th><th>ksgp</th><th>Stage</th><th>Games</th><th>Last</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="card" style="margin-top:14px;">
        <h2>Activity chain (private ledger)</h2>
        <p style="opacity:0.7;font-size:0.85rem;">Login → stages → jackpot wins/losses · like a private blockchain of user actions</p>
        <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
          <input id="filter-email" placeholder="Filter by email" style="flex:1;min-width:160px;padding:8px;border-radius:8px;border:1px solid #555;background:#1a1a2e;color:#fff;" />
          <button class="btn small" id="btn-refresh-ledger">Refresh chain</button>
        </div>
        <div id="ledger" style="max-height:480px;overflow:auto;font-size:0.78rem;font-family:ui-monospace,monospace;"></div>
      </div>
    </div>
  </div>
  <footer class="site-footer"><span>All rights reserved by KSGP token</span></footer>
  <script>
    async function loadUsers() {
      const me = await fetch('/api/me', { credentials: 'include' }).then(r => r.json());
      if (!me.authenticated || !me.user.isAdmin) {
        document.getElementById('admin-status').textContent = 'Access denied. Admin only (shapyaar@gmail.com).';
        return;
      }
      document.getElementById('admin-content').classList.remove('hidden');
      const data = await fetch('/api/admin/users', { credentials: 'include' }).then(r => r.json());
      if (data.error) {
        document.getElementById('admin-status').textContent = data.error;
        return;
      }
      const s = data.summary;
      document.getElementById('summary').innerHTML = [
        ['Users', s.totalUsers],
        ['Total ksgp', Number(s.totalKsgpDistributed).toLocaleString()],
        ['Games played', s.totalGamesPlayed],
        ['Max stage', s.maxLevelReached],
        ['With save', s.usersWithSave]
      ].map(([k,v]) => `<div style="background:rgba(0,0,0,0.25);padding:10px;border-radius:10px;"><div style="opacity:0.7;font-size:0.75rem;">${k}</div><div style="font-size:1.2rem;font-weight:700;">${v}</div></div>`).join('');
      const tb = document.querySelector('#users-table tbody');
      tb.innerHTML = data.users.map(u => `<tr style="border-bottom:1px solid rgba(255,255,255,0.06);">
        <td>${u.name||''}</td><td>${u.email}</td>
        <td style="color:#00e676;font-weight:600;">${Number(u.ksgp).toLocaleString()}</td>
        <td>${u.currentLevel}</td><td>${u.gamesPlayed}</td>
        <td>${u.lastPlayed ? new Date(u.lastPlayed).toLocaleString() : '—'}</td>
      </tr>`).join('');
    }
    async function loadLedger() {
      const email = document.getElementById('filter-email').value.trim();
      const url = '/api/admin/ledger?limit=300' + (email ? '&email=' + encodeURIComponent(email) : '');
      const data = await fetch(url, { credentials: 'include' }).then(r => r.json());
      if (data.error) {
        document.getElementById('ledger').textContent = data.error;
        return;
      }
      document.getElementById('ledger').innerHTML = (data.chain||[]).map(row => {
        const amt = Number(row.amount)||0;
        const col = amt > 0 ? '#69f0ae' : (amt < 0 ? '#ff8a80' : '#90a4ae');
        const det = typeof row.detail === 'object' ? JSON.stringify(row.detail) : row.detail;
        return `<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.07);">
          <span style="color:#ffd700;">#${row.id}</span>
          <span style="color:#80cbc4;">${row.email||''}</span>
          <strong> ${row.action}</strong>
          <span style="color:${col}"> ${amt>=0?'+':''}${amt.toLocaleString()}</span>
          <span style="opacity:0.6;"> → ${row.balanceAfter!=null?Number(row.balanceAfter).toLocaleString():'—'}</span>
          <div style="opacity:0.5;word-break:break-all;">${det}</div>
          <div style="opacity:0.45;">${row.createdAt ? new Date(row.createdAt).toLocaleString() : ''}</div>
        </div>`;
      }).join('') || '<p>No entries</p>';
    }
    document.getElementById('btn-refresh-ledger').onclick = loadLedger;
    loadUsers().then(loadLedger);
  </script>
</body>
</html>
